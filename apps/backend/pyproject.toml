[project]
name = "sima-backend"
version = "0.1.0"
description = "SIMA backend API"
requires-python = ">=3.14,<3.15"
dependencies = [
  "alembic==1.18.4",
  "argon2-cffi==25.1.0",
  "fastapi==0.128.2",
  "httpx==0.28.1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings==2.14.1",
  "sqlalchemy==2.0.50",
  "uvicorn[standard]==0.48.0",
]

[dependency-groups]
dev = [
  "mypy>=1.18,<2",
  "pytest==9.0.2",
  "pytest-asyncio==1.3.0",
  "ruff>=0.14,<1",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.14"
strict = true
plugins = []
warn_unused_configs = true
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = ["psycopg.*"]
ignore_missing_imports = true
